# Packaging for `pip install novomcp` + the `novomcp` console entrypoint.
#
# The engine lives under src/novomcp/ (src-layout). Every module is namespaced
# under `novomcp.` so the package installs cleanly alongside anything else in a
# user's environment — no top-level `mcp` / `core` / `utils` / `config` clash.
# A root main_https.py shim keeps `python main_https.py` working from a checkout.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novomcp"
description = "NovoMCP — the open computational chemistry engine (MCP + REST server)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NovoMCP (Quant NexusAI Inc.)" }]
keywords = ["computational-chemistry", "mcp", "drug-discovery", "materials-science", "cheminformatics", "admet"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = ["version", "dependencies"]

[project.scripts]
novomcp = "novomcp.main_https:main"

[project.urls]
Homepage = "https://novomcp.com"
Repository = "https://github.com/NovoMCP/novomcp"
Documentation = "https://docs.novomcp.com/"

[tool.setuptools.dynamic]
version = { attr = "novomcp.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["novomcp*"]

[tool.setuptools.package-data]
# Runtime data shipped inside the package (resolved relative to the module).
novomcp = ["*.json"]                    # faves_reference_lists.json / openapi.json when present
"novomcp.data" = ["*.json"]             # hgnc_symbols.json
"novomcp.core.intake" = ["*.yaml"]      # pfam_roles.yaml
