name: docker-publish

# Builds the engine container and publishes it to the GitHub Container
# Registry (GHCR) so users can `docker pull ghcr.io/novomcp/novomcp:latest`
# instead of building locally from orchestrator/Dockerfile.
#
# Triggers: every push to main (refreshes :latest + a :sha-<short> tag) and
# every version tag (publishes :vX.Y.Z + the moving :X.Y / :X major tags).
# workflow_dispatch allows a manual rebuild.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR under the NovoMCP org

jobs:
  image:
    runs-on: ubuntu-latest
    # A normal build takes ~10 min; the emulated arm64 build occasionally
    # hangs, and without a limit it would block for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels from the event. metadata-action lowercases the
      # image name, so NovoMCP/novomcp -> ghcr.io/novomcp/novomcp.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # QEMU registers the emulator for cross-arch builds so the arm64 image
      # can build on an amd64 runner. The engine is pure-Python (rdkit / numpy
      # / MDAnalysis all publish aarch64 wheels — verified on a GB10 Grace box),
      # so there's no native compile to slow the emulated build down.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the engine source dir; all COPY paths in the
      # Dockerfile are relative to orchestrator/ (see its header comment).
      # Multi-arch: amd64 (existing) + arm64 (Apple Silicon, and DGX Spark /
      # GB10 for the local-full-engine deployment). One manifest; `docker pull`
      # resolves the caller's arch automatically.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The web dashboard, as ghcr.io/novomcp/web. compose.spark.yml runs it on the
  # Spark, so it's multi-arch like the engine.
  #
  # Each architecture builds on its own NATIVE runner rather than emulating
  # arm64 with QEMU on an amd64 box. A Next.js build is CPU-bound JavaScript,
  # the worst case for emulation: it ran 5-20x slower and intermittently blew
  # past the 30-minute limit (run #54). Each job pushes an untagged image by
  # digest; web-manifest then joins the two digests into one tag list, so
  # `docker pull` still resolves the caller's arch from a single manifest.
  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Native builds take ~3-5 min; this is a backstop, not a budget.
    timeout-minutes: 30
    steps:
      # linux/amd64 -> linux-amd64: usable in a cache scope and an artifact name.
      - name: Slash-free platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; the tags are applied once, by web-manifest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/web

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Push by digest only: no tags here, because a tag pushed from two jobs
      # would race, each overwriting the other's single-arch image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend-nextjs
          file: frontend-nextjs/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # name= is required: push-by-digest pushes no tag, so without it
          # buildx has no repository to push to ("tag is needed when pushing
          # to registry").
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=web-${{ env.PLATFORM_PAIR }}

      # The filename IS the digest, bare: the merge step rebuilds the reference
      # as web@sha256:<filename>, so the sha256: prefix has to come off here or
      # it ends up doubled.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one multi-arch manifest and applies the
  # tags the single-arch pushes deliberately skipped.
  web-manifest:
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-web-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/web@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/web:latest
