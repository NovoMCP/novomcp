name: docker-publish

# Builds the engine container and publishes it to the GitHub Container
# Registry (GHCR) so users can `docker pull ghcr.io/novomcp/novomcp:latest`
# instead of building locally from orchestrator/Dockerfile.
#
# Triggers: every push to main (refreshes :latest + a :sha-<short> tag) and
# every version tag (publishes :vX.Y.Z + the moving :X.Y / :X major tags).
# workflow_dispatch allows a manual rebuild.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR under the NovoMCP org

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels from the event. metadata-action lowercases the
      # image name, so NovoMCP/novomcp -> ghcr.io/novomcp/novomcp.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the engine source dir; all COPY paths in the
      # Dockerfile are relative to orchestrator/ (see its header comment).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
