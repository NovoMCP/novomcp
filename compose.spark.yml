# NovoMCP — Novo Station: the whole engine on one NVIDIA DGX Spark (GB10).
#
#   docker compose -f compose.spark.yml up -d
#
# Engine at http://localhost:8018, dashboard at http://localhost:3000. Every
# compute service runs locally on the same box and is env-var-wired to the
# engine — no cloud, no API key for the engine itself, no tokens leaving the
# Spark during a run. The GPU services carry an NVIDIA device reservation and
# time-share the single GB10 GPU.
#
# All images are published for arm64: the engine, the dashboard, chem-props,
# addie-models and novomcp-properties are multi-arch `:latest` (docker
# auto-selects arm64); the compiled GPU/native services use the arm64 `:spark` tag.
#
# Compliance screening is the one piece that isn't on the box: it's closed source
# and served from api.novomcp.com. Add its URL and your API key in the
# dashboard (Connections -> NovoMCP compliance), then restart the engine.

# The compute services' URLs, shared by the engine (which calls them) and the
# dashboard (which shows whether each one answers).
x-service-urls: &service-urls
  CHEM_PROPS_URL:   http://chem-props:8003
  NOVOMCP_NNP_URL:  http://novomcp-nnp:8032
  NOVOMCP_QM_URL:   http://novomcp-qm:8031
  AUTODOCK_GPU_URL: http://autodock-gpu:8022
  GROMACS_MD_URL:   http://gromacs-md:8024
  ADDIE_MODELS_URL: http://addie-models:8025
  NOVOMCP_PROPERTIES_URL: http://novomcp-properties:8030

services:
  engine:
    image: ghcr.io/novomcp/novomcp:latest
    container_name: novomcp-engine
    ports:
      - "8018:8018"
    volumes:
      # Audit log + credentials.env (keys and URLs saved from the dashboard).
      - novomcp-audit:/root/.novo
    environment:
      <<: *service-urls                # compute services, all local on this box
      NOVO_AUTH: local
      NOVO_METER: local
      NOVO_AUDIT: local
      NOVO_AUDIT_PATH: /root/.novo/audit.jsonl
      GROMACS_API_KEY:  local          # must match gromacs-md's API_KEY below
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped

  # Web dashboard: status of every service, Profile, Connections (LLM keys,
  # NovoMCP compliance), the audit log. It shares /root/.novo with the engine so
  # what you save in Connections is what the engine loads on its next start,
  # and runs as root to write there (the volume is root-owned).
  web:
    image: ghcr.io/novomcp/web:latest
    container_name: novomcp-web
    user: "0:0"
    ports:
      - "3000:3000"
    volumes:
      - novomcp-audit:/root/.novo
    environment:
      <<: *service-urls
      NOVOMCP_ENGINE_URL: http://engine:8018
      NOVO_AUTH: local
      HOME: /root
    depends_on: [engine]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novomcp-redis
    volumes:
      - novomcp-redis-data:/data
    restart: unless-stopped

  # ---- CPU services (multi-arch; arm64 selected automatically) ----
  chem-props:
    image: ghcr.io/novomcp/chem-props:latest
    container_name: novomcp-chem-props
    ports: ["8003:8003"]
    restart: unless-stopped
    # RDKit descriptors, similarity, BOILED-Egg. ~200 MB, CPU only.

  novomcp-qm:
    image: ghcr.io/novomcp/novomcp-qm:spark
    container_name: novomcp-qm
    ports: ["8031:8031"]
    restart: unless-stopped
    # xTB / CREST / sTDA (xTB and sTDA built from source, CREST from conda-forge). CPU.

  addie-models:
    image: ghcr.io/novomcp/addie-models:latest
    container_name: novomcp-addie-models
    ports: ["8025:8025"]
    restart: unless-stopped
    # 31 ADMET models (DGL/GIN). Multi-arch; GIN-embedding parity validated vs x86
    # (~1e-6). Weights load from the open Hugging Face backend — no creds. CPU.

  novomcp-properties:
    image: ghcr.io/novomcp/novomcp-properties:latest
    container_name: novomcp-properties
    ports: ["8030:8030"]
    environment:
      NOVOMCP_QM_URL: http://novomcp-qm:8031   # charge-based pKa routes + frontier orbitals
    restart: unless-stopped
    # Physicochemical properties: aqueous solubility (Chemprop/AqSolDB) and bond
    # dissociation energies (ALFABET), validated on GB10. Multi-arch; weights from
    # Hugging Face. CPU.

  # ---- GPU services (share the single GB10 GPU) ----
  novomcp-nnp:
    image: ghcr.io/novomcp/novomcp-nnp:spark
    container_name: novomcp-nnp
    ports: ["8032:8032"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped
    # MACE-MPA-0 (ASE + ALCHEMI) + ANI-2x. The entrypoint sets OMP_NUM_THREADS
    # and LD_PRELOAD=libjemalloc (the two Grace fixes) automatically.

  gromacs-md:
    image: ghcr.io/novomcp/gromacs-md:spark
    container_name: novomcp-gromacs-md
    init: true   # reaps processes a cancelled job leaves behind (sqm under ACPYPE)
    ports: ["8024:8024"]
    environment:
      API_KEY: local                    # the service refuses jobs without one
      REDIS_URL: redis://redis:6379/0   # job status for get_job_status
      AUTODOCK_GPU_URL: http://autodock-gpu:8022   # dock the ligand first: protein-ligand MD starts from the pose
      LOCAL_RESULTS_DIR: /data/md-results   # no S3 here: keep result.json, trajectory and .xvg per job
      RESULTS_HOST_DIR: ${PWD}/md-results       # where results say they are: the host side of the volume
    volumes:
      - ./md-results:/data/md-results     # one folder per job_id; ~90 MB per protein-ligand ns
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped
    # GROMACS 2026.x (sm_121 + ARM_NEON_ASIMD). GPU MD: nb + PME + update on GPU.

  autodock-gpu:
    image: ghcr.io/novomcp/autodock-gpu:spark
    container_name: novomcp-autodock-gpu
    ports: ["8022:8022"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    restart: unless-stopped
    # AutoDock-GPU, native sm_121 kernels. Protein-ligand docking on the GPU.

  # openfold3 (structure prediction) and the generative / free-energy paths are
  # not part of the Spark port — run them elsewhere. See the field report for scope.

volumes:
  novomcp-audit:
  novomcp-redis-data:
